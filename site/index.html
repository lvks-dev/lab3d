<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080D" />
    <meta name="color-scheme" content="dark" />

    <title>Lab3D — Odontologia Digital</title>
    <meta
      name="description"
      content="Laboratório de prótese dental para dentistas e consultórios: fluxo digital com Exocad, Blender e escaneamento intraoral, somado ao domínio da prótese analógica."
    />

    <!--
      TODO: domínio definitivo ainda não registrado. As URLs absolutas abaixo (canonical, og:url,
      og:image) usam o subdomínio provisório do Cloudflare Pages. Ao conectar o domínio próprio,
      atualizar aqui e em SITE.url (src/lib/constants.ts) — WhatsApp exige og:image absoluta.
    -->
    <link rel="canonical" href="https://lab3d.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Lab3D" />
    <meta property="og:title" content="Lab3D — Odontologia Digital" />
    <meta
      property="og:description"
      content="Prótese dental com fluxo digital e domínio analógico, em parceria com o dentista."
    />
    <meta property="og:url" content="https://lab3d.pages.dev/" />
    <meta property="og:image" content="https://lab3d.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lab3D — Odontologia Digital" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="preload"
      href="/fonts/manrope-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
